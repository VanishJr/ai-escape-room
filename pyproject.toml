[project]
name = "ai-escape-room"
version = "0.1.0"
description = "LLM-powered escape room: a naive LLM game master (V1) and a reliable, rule-validated version (V2)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.1.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "v1", "v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
