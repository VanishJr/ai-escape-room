name: tests

# The test suite uses a scripted fake LLM, so it runs without a Gemini API key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies from uv.lock
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest -v
